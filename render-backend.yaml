services:
  - type: web
    name: geocadastra-backend
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python scripts/fetch_maskrcnn_checkpoint.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
